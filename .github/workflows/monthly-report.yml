name: Monatsrecherche und Bericht
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Monat (YYYY-MM)'
        required: false
        default: ''
  schedule:
    - cron: "17 6 5 * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-report.yml'
      - 'scripts/backfill.py'
      - 'scripts/discover_springer.py'
      - 'scripts/verify_springer_inventory.py'
      - 'scripts/audit_publisher_inventory.py'
      - 'scripts/verify_discovered_candidates.py'
      - 'tests/test_verify_discovered_candidates.py'
      - 'tests/test_audit_publisher_inventory.py'
      - 'tests/test_verify_springer_inventory.py'
      - 'tests/test_discover_springer.py'
      - 'scripts/build_months.py'
      - 'scripts/verify_publishers.py'
      - 'scripts/recover_publisher_online_dates.py'
      - 'tests/test_recover_publisher_online_dates.py'
      - 'scripts/audit_candidates.py'
      - 'scripts/audit_coverage.py'
      - 'scripts/validate_report.py'
      - 'scripts/export_report.py'
      - 'scripts/export_html.py'
      - 'tests/test_backfill.py'
      - 'tests/test_validate_report.py'
      - 'tests/test_verify_publishers.py'
      - 'tests/test_export_html.py'
      - 'data/publisher-evidence/**'
permissions:
  contents: write
concurrency:
  group: literature-data-write
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Aktuellen Hauptzweig vor der Recherche übernehmen
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Berichtsmonat bestimmen
        id: period
        env:
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -n "$INPUT_MONTH" ]; then
            MONTH="$INPUT_MONTH"
          else
            MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
          fi
          python - "$MONTH" <<'PY'
          import datetime
          import re
          import sys
          month = sys.argv[1]
          if not re.fullmatch(r"20[0-9]{2}-(0[1-9]|1[0-2])", month):
              raise SystemExit("Monat muss im Format YYYY-MM angegeben werden")
          if datetime.date.fromisoformat(month + "-01") > datetime.date.today().replace(day=1):
              raise SystemExit("Zukünftiger Monat ist nicht erlaubt")
          PY
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
      - name: Monat bei Crossref nachrecherchieren
        run: python scripts/backfill.py --month "${{ steps.period.outputs.month }}"
      - name: Springer-Verlagsinventur unabhängig von Crossref versuchen
        run: python scripts/discover_springer.py --month "${{ steps.period.outputs.month }}"
      - name: Springer-Inventurtests
        run: python -m unittest discover -s tests -p 'test_discover_springer.py' -v
      - name: HTML-Daten neu erzeugen
        run: python scripts/build_months.py
      - name: Fehlende Erst-Online-Daten aus DOI-Verlagsseiten nachermitteln
        run: python scripts/recover_publisher_online_dates.py --month "${{ steps.period.outputs.month }}"
      - name: Regressionstest Nachermittlung der Online-Erstveröffentlichung
        run: python -m unittest discover -s tests -p 'test_recover_publisher_online_dates.py' -v
      - name: Monatsdaten mit nachermittelten Verlagsdaten aktualisieren
        run: python scripts/build_months.py
      - name: Unabhängige Springer-Kandidaten anhand von Online-Daten prüfen
        run: python scripts/verify_springer_inventory.py --month "${{ steps.period.outputs.month }}"
      - name: Tests unabhängige Springer-Verlagsdatierung
        run: python -m unittest discover -s tests -p 'test_verify_springer_inventory.py' -v
      - name: Unabhängig entdeckte Verlags-DOIs artikelweise prüfen
        run: python scripts/verify_discovered_candidates.py --month "${{ steps.period.outputs.month }}" --fail-on-missing
      - name: Tests der unabhängigen Verlagskandidatenprüfung
        run: python -m unittest discover -s tests -p 'test_verify_discovered_candidates.py' -v
      - name: Unabhängige Verlagsabdeckung aller 24 Zeitschriften dokumentieren
        run: python scripts/audit_publisher_inventory.py --month "${{ steps.period.outputs.month }}"
      - name: Tests Verlagsabdeckung aller 24 Zeitschriften
        run: python -m unittest discover -s tests -p 'test_audit_publisher_inventory.py' -v
      - name: Verlagsdaten artikelweise abgleichen
        run: python scripts/verify_publishers.py "$REPORT_MONTH"
        env:
          REPORT_MONTH: ${{ steps.period.outputs.month }}
      - name: Regressionstest Verlagsdaten und Monatsabgrenzung
        run: python -m unittest discover -s tests -p 'test_verify_publishers.py' -v
      - name: Zurückgestellte Kandidaten und Berichtsqualität prüfen
        run: python scripts/audit_candidates.py "$REPORT_MONTH"
        env:
          REPORT_MONTH: ${{ steps.period.outputs.month }}
      - name: Vollständigkeit der 24 Zeitschriften dokumentieren
        run: python scripts/audit_coverage.py "$REPORT_MONTH"
        env:
          REPORT_MONTH: ${{ steps.period.outputs.month }}
      - name: Datenkonsistenz und redaktionelle Sperre prüfen
        run: python scripts/validate_report.py "$REPORT_MONTH"
        env:
          REPORT_MONTH: ${{ steps.period.outputs.month }}
      - name: Diagnose bei unvollständiger Recherche sichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Recherche-Diagnose-${{ steps.period.outputs.month }}-${{ github.run_id }}
          path: |
            data/backfill-${{ steps.period.outputs.month }}.json
            data/coverage/
            data/publisher-inventory/${{ steps.period.outputs.month }}.json
            data/publisher-inventory/${{ steps.period.outputs.month }}-verified.json
            data/publisher-candidate-checks/${{ steps.period.outputs.month }}.json
            data/quality/${{ steps.period.outputs.month }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Regressionstest Crossref und Null-Treffer-Suche
        run: python -m unittest discover -s tests -p 'test_backfill.py' -v
      - name: Regressionstest wissenschaftliche Datenvalidierung
        run: python -m unittest discover -s tests -p 'test_validate_report.py' -v
      - name: Regressionstest HTML und Freigabesperre
        run: python -m unittest discover -s tests -p 'test_export_html.py' -v
      - name: Leserbericht als eigenständige HTML-Datei erstellen
        run: python scripts/export_html.py "$REPORT_MONTH" --output exports
        env:
          REPORT_MONTH: ${{ steps.period.outputs.month }}
      - name: HTML-Artefakt vor Upload unabhängig prüfen
        env:
          REPORT_MONTH: ${{ steps.period.outputs.month }}
        run: |
          python - <<'PY'
          import json
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          month = os.environ["REPORT_MONTH"]
          page = Path("exports") / f"Literaturbericht-{month}.html"
          content = page.read_text(encoding="utf-8")
          report = json.loads((Path("data/months") / f"{month}.json").read_text(encoding="utf-8"))
          coverage = json.loads((Path("data/coverage") / f"{month}.json").read_text(encoding="utf-8"))

          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.articles = 0
                  self.doi_links = []
                  self.tables = 0
                  self.rows = 0
                  self.in_tbody = False
                  self.inputs = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "article":
                      self.articles += 1
                  if tag == "a" and attrs.get("href", "").startswith("https://doi.org/"):
                      self.doi_links.append(attrs["href"])
                  if tag == "tbody":
                      self.in_tbody = True
                      self.tables += 1
                  if tag == "tr" and self.in_tbody:
                      self.rows += 1
                  if tag == "input":
                      self.inputs += 1
              def handle_endtag(self, tag):
                  if tag == "tbody":
                      self.in_tbody = False

          parser = Inspect()
          parser.feed(content)
          assert content.lstrip().lower().startswith("<!doctype html>"), "Not a standalone HTML document"
          assert parser.articles == report["verified_online_count"], "Article count differs from verified dataset"
          assert len(parser.doi_links) == parser.articles, "DOI links missing"
          assert len(set(parser.doi_links)) == len(parser.doi_links), "Duplicate DOI links"
          assert parser.tables == 1 and parser.rows == 24, "24 journal audit rows missing"
          assert coverage["journals_expected"] == 24, "Unexpected journal coverage"
          assert parser.inputs == 0, "Search/input field present"
          assert "Rechercheentwurf" not in content, "Draft marker present"
          print(f"Validated {page}: {parser.articles} DOI entries, {parser.rows} audit rows")
          PY
      - name: Berichtspaket als GitHub-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Literaturbericht-${{ steps.period.outputs.month }}-HTML
          path: exports/
          if-no-files-found: error
          retention-days: 90
      - name: Monatsberichte speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observed.json data/backfill-*.json data/months/ data/publisher-checks/ data/publisher-candidate-checks/ data/publisher-inventory/ data/quality/ data/coverage/
          if ! git diff --cached --quiet; then
            git commit -m "Aktualisiere Monatsbericht ${{ steps.period.outputs.month }}"
            # Never silently resolve conflicts in scientific evidence or review files.
            # A concurrent edit must be reviewed rather than overwritten.
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Paralleländerung während der Recherche: Rebase-Konflikt. Keine Qualitäts- oder Freigabedaten überschrieben. Recherche auf aktuellem main erneut starten.'
              exit 1
            fi
            git push origin HEAD:main
          else
            echo "Keine geänderten Ergebnisdateien. Prüfe Kandidatenzahlen im Monatsbericht."
          fi
      - name: Kandidatenbericht prüfen
        run: |
          python -c 'import json,os; m=os.environ["REPORT_MONTH"]; r=json.load(open("data/months/"+m+".json")); print("Monat",m,"Online",r["verified_online_count"],"Kandidaten",r["candidate_count"]); assert r["count"]==len(r["articles"])'
        env:
          REPORT_MONTH: ${{ steps.period.outputs.month }}
