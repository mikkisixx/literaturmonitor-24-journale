name: Crossref-Metadaten sammeln
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: crossref-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Metadaten abrufen
        run: python scripts/collect.py
      - name: Vorläufige Monatsansichten erzeugen
        run: python scripts/build_months.py
      - name: Ergebnisse versionieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observed.json data/status.json data/months/
          if ! git diff --cached --quiet; then
            git commit -m "Aktualisiere Crossref-Metadaten"
            git push
          fi
