name: Neuerscheinungen – Monat auswählen und sammeln
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Gewünschter Monat (YYYY-MM), z. B. 2026-08'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/einfacher-html-bericht.yml'
      - 'scripts/export_neuerscheinungen.py'
      - 'scripts/prepare_simple_report.py'
      - 'scripts/augment_online_dates.py'
      - 'scripts/recover_publisher_online_dates.py'
      - 'scripts/verify_publishers.py'
      - 'scripts/report_provenance.py'
      - 'scripts/audit_missing_journals.py'
      - 'scripts/backfill.py'
      - 'scripts/validate_report.py'
      - 'scripts/build_months.py'
      - 'scripts/discover_springer.py'
      - 'scripts/verify_springer_inventory.py'
      - 'tests/**'
permissions:
  contents: read
jobs:
  neuerscheinungen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Alle Regressionstests einschließlich monatlicher Qualitätsmetadaten
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Berichtsmonat dynamisch bestimmen
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            MONTH="$REQUESTED_MONTH"
          else
            MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
          fi
          echo "REPORT_MONTH=$MONTH" >> "$GITHUB_ENV"
      - name: Berichtsmonat prüfen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: |
          python - <<'PY'
          import os,re,datetime
          m=os.environ["MONTH"]
          if not re.fullmatch(r"20[0-9]{2}-(0[1-9]|1[0-2])",m):
              raise SystemExit("Monat muss YYYY-MM sein")
          if datetime.date.fromisoformat(m+"-01") > datetime.date.today().replace(day=1):
              raise SystemExit("Zukünftiger Monat nicht erlaubt")
          print("Sammle Artikel für",m)
          PY
      - name: Artikel der 24 Journale für ausgewählten Monat sammeln
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/backfill.py --month "$MONTH"
      - name: Monatsartikel zusammenstellen
        run: python scripts/build_months.py
      - name: Springer-Verlagsseiten zusätzlich nach Artikeln durchsuchen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/discover_springer.py --month "$MONTH"
      - name: Online-Erstveröffentlichung direkt bei Springer prüfen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/verify_springer_inventory.py --month "$MONTH"
      - name: Alle 24 Zeitschriften gezielt nach Online-Veröffentlichungsdatum abfragen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/augment_online_dates.py --month "$MONTH"
      - name: Fehlende Online-Erstveröffentlichungsdaten direkt bei Verlagen nachermitteln
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/recover_publisher_online_dates.py --month "$MONTH"
      - name: Monatsdaten mit zusätzlich bestätigten Datumsangaben neu zusammenstellen
        run: python scripts/build_months.py
      - name: Recherchegrenzen für diesen Lauf kennzeichnen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/prepare_simple_report.py "$MONTH"
      - name: Monatliche Daten, DOI-Eindeutigkeit und Quellenbelege streng validieren
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/validate_report.py "$MONTH"
      - name: Neuerscheinungen-Webseite im vertrauten Layout erstellen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/export_neuerscheinungen.py "$MONTH" --output exports
      - name: Erzeugtes HTML-Artefakt auf Monat und unerwünschte Elemente prüfen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          month=os.environ["MONTH"]
          target=Path("exports") / ("Neuerscheinungen_"+month+".html")
          if not target.is_file():
              raise SystemExit(f"HTML-Bericht fehlt: {target}")
          html=target.read_text(encoding="utf-8")
          if len(html)<1000 or "<html" not in html.lower() or "</html>" not in html.lower():
              raise SystemExit("HTML-Bericht ist leer oder unvollständig")
          for forbidden in ("Rechercheentwurf:", "Artikel oder Zeitschrift suchen"):
              if forbidden in html:
                  raise SystemExit(f"Unerwünschtes Element im Bericht: {forbidden}")
          if "<style" not in html.lower():
              raise SystemExit("Eigenständige HTML-Gestaltung fehlt")
          import json, re
          from datetime import date
          from html.parser import HTMLParser
          report=json.loads((Path("data/months") / (month+".json")).read_text(encoding="utf-8"))
          expected={
              str(a["doi"]).strip().lower()
              for a in report["articles"]
              if a.get("date_basis") in ("crossref_online","publisher_online")
              and a.get("online_date")
              and date.fromisoformat(a["online_date"]).strftime("%Y-%m")==month
          }
          class ReportParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.dois=[]
                  self.article_count=0
              def handle_starttag(self, tag, attrs):
                  if tag=="article":
                      self.article_count+=1
              def handle_data(self, data):
                  self.dois.extend(x.lower() for x in re.findall(r"DOI:\s*(10\.\d{4,9}/[^\s]+)",data))
          parsed=ReportParser()
          parsed.feed(html)
          actual=set(parsed.dois)
          if len(parsed.dois)!=len(actual) or actual!=expected or parsed.article_count!=len(expected):
              raise SystemExit(
                  f"HTML-Inhaltsprüfung fehlgeschlagen: erwartet {len(expected)} eindeutige DOI, "
                  f"gefunden {parsed.article_count} Artikel / {len(parsed.dois)} DOI; "
                  f"fehlend={sorted(expected-actual)[:5]}, unerwartet={sorted(actual-expected)[:5]}"
              )
          print(f"HTML-Artefakt einschließlich {len(expected)} DOI geprüft: {target} ({len(html)} Zeichen)")
          PY
      - name: Fehlende Zeitschriften und ungeklärte Artikel gesondert prüfen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/audit_missing_journals.py --month "$MONTH"
      - name: Quellen- und Vollständigkeitsprotokoll für alle 24 Zeitschriften erstellen
        env:
          MONTH: ${{ env.REPORT_MONTH }}
        run: python scripts/report_provenance.py --month "$MONTH"
      - name: Quellenprotokoll zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Quellenprotokoll-${{ env.REPORT_MONTH }}
          path: data/online-audit/${{ env.REPORT_MONTH }}-provenance.json
          if-no-files-found: error
      - name: Einzelbelege der Verlagsprüfung bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Verlagsdatumspruefung-${{ env.REPORT_MONTH }}
          path: data/publisher-candidate-checks/${{ env.REPORT_MONTH }}.json
          if-no-files-found: error
      - name: Fehlende Zeitschriften als Prüfliste zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Fehlende-Zeitschriften-${{ env.REPORT_MONTH }}
          path: data/missing-journals/${{ env.REPORT_MONTH }}.json
          if-no-files-found: error
      - name: Fertige HTML-Datei zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Neuerscheinungen-${{ env.REPORT_MONTH }}
          path: exports/Neuerscheinungen_${{ env.REPORT_MONTH }}.html
          if-no-files-found: error
          retention-days: 90
      - name: Recherche-Diagnose bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Recherchefehler-${{ env.REPORT_MONTH }}
          path: |
            data/backfill-${{ env.REPORT_MONTH }}.json
          if-no-files-found: ignore
