name: End-to-End-Nachweis frei wählbarer Monat
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Berichtsmonat (YYYY-MM)'
        required: true
        default: '2026-08'
        type: string
concurrency:
  group: verify-alternative-month-${{ github.repository }}
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  verify-alternative-month:
    env:
      REPORT_MONTH: ${{ inputs.month }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Monatsformat prüfen
        shell: bash
        run: |
          [[ "$REPORT_MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo '::error::Ungültiger Monat'; exit 1; }
      - name: Beide Monatsgeneratoren auslösen und ihre Run-IDs erfassen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in monthly-report.yml einfacher-html-bericht.yml; do
            # Record existing runs before dispatch so concurrent/manual dispatches
            # from the same second cannot be mistaken for this verification run.
            before="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id]')"
            gh workflow run "$workflow" --ref main -f month="$REPORT_MONTH"
            id=""
            for attempt in $(seq 1 30); do
              candidates="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=100" | jq --argjson before "$before" '[.workflow_runs[] | select(.head_branch == "main" and (.id as $id | $before | index($id) | not)) | .id]')"
              count="$(jq 'length' <<< "$candidates")"
              if [[ "$count" -eq 1 ]]; then
                id="$(jq -r '.[0]' <<< "$candidates")"
                break
              fi
              if [[ "$count" -gt 1 ]]; then
                echo "::error::Mehrere neue $workflow-Läufe gefunden; Zuordnung nicht eindeutig"
                exit 1
              fi
              sleep 10
            done
            if [[ -z "$id" ]]; then echo "::error::Run-ID für $workflow nicht gefunden"; exit 1; fi
            if [[ "$workflow" == monthly-report.yml ]]; then echo "monthly_report_yml=$id" >> "$GITHUB_ENV"; else echo "einfacher_html_bericht_yml=$id" >> "$GITHUB_ENV"; fi
            echo "Dispatched $workflow: $id"
          done
      - name: Beide Läufe bis zum erfolgreichen Abschluss überwachen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in monthly-report.yml einfacher-html-bericht.yml; do
            if [[ "$workflow" == monthly-report.yml ]]; then id="$monthly_report_yml"; else id="$einfacher_html_bericht_yml"; fi
            result=""
            for attempt in $(seq 1 180); do
              status="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.status')"
              if [[ "$status" == completed ]]; then
                result="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.conclusion')"
                break
              fi
              echo "$workflow ($id): $status; poll $attempt/180"
              sleep 30
            done
            [[ "$result" == success ]] || { echo "::error::$workflow: ${result:-timeout}; run $id"; exit 1; }
          done
      - name: Artefakte herunterladen und Monats-HTML inhaltlich prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checked/monthly checked/simple
          gh run download "$monthly_report_yml" --name "Literaturbericht-${REPORT_MONTH}-HTML" --dir checked/monthly
          gh run download "$einfacher_html_bericht_yml" --dir checked/simple
          python - <<'PY'
          import os
          month = os.environ["REPORT_MONTH"]
          from html.parser import HTMLParser
          from pathlib import Path
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.articles = 0
                  self.dois = []
                  self.inputs = 0
                  self.audit_rows = 0
                  self.in_tbody = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "article": self.articles += 1
                  if tag == "input": self.inputs += 1
                  if tag == "tbody": self.in_tbody = True
                  if tag == "tr" and self.in_tbody: self.audit_rows += 1
                  if tag == "a" and attrs.get("href", "").startswith("https://doi.org/"):
                      self.dois.append(attrs["href"])
              def handle_endtag(self, tag):
                  if tag == "tbody": self.in_tbody = False
          monthly_files = list(Path("checked/monthly").rglob("*.html"))
          simple_files = list(Path("checked/simple").rglob("*.html"))
          assert monthly_files, "Kein HTML im Monatsbericht-Artefakt"
          assert simple_files, "Kein HTML im einfachen Berichts-Artefakt"
          expected_monthly = f"Literaturbericht-{month}.html"
          assert any(p.name == expected_monthly for p in monthly_files), (
              f"Erwarteter Monatsbericht {expected_monthly} fehlt im Artefakt"
          )
          assert all(month in p.name for p in monthly_files + simple_files), (
              "Artefakt enthält HTML-Dateien eines anderen Berichtsmonats"
          )
          import json
          provenance_files = list(Path("checked/simple").rglob("*-provenance.json"))
          assert len(provenance_files) == 1, "Quellenprotokoll fehlt oder ist nicht eindeutig"
          provenance = json.loads(provenance_files[0].read_text(encoding="utf-8"))
          assert provenance["month"] == month, "Falscher Monat im Quellenprotokoll"
          assert provenance["journal_count"] == 24, "Quellenprotokoll deckt nicht 24 Journale ab"
          journals = provenance["journals"]
          assert len(journals) == 24 and len({j["journal"] for j in journals}) == 24, "Journalzeilen fehlen oder sind doppelt"
          assert provenance["independently_complete"] is False, "Unbelegte Vollständigkeit behauptet"
          assert all(j["independently_exhaustive"] is False for j in journals), "Unbelegte Verlagsvollständigkeit behauptet"
          assert all(j.get("reason") for j in journals), "Begründung der Vollständigkeitsgrenze fehlt"
          assert all(j.get("crossref_api_source") == "https://api.crossref.org/works" for j in journals), "Crossref-Quellenangabe fehlt"
          assert all(isinstance(j.get("publisher_listing_urls"), list) for j in journals), "Verlagslistenquellen fehlen"
          assert all(j.get("crossref_publication_query", {}).get("status") in ("queried", "failed", "not_run") for j in journals), "Abfragestatus fehlt"
          # Audit the downloaded scientific dataset, not just the HTML shell.
          datasets = list(Path("checked/monthly").rglob(f"{month}.json"))
          assert len(datasets) == 1, "Monatsdatensatz fehlt oder ist nicht eindeutig"
          dataset = json.loads(datasets[0].read_text(encoding="utf-8"))
          assert dataset["month"] == month, "Monatsdatensatz hat falschen Monat"
          articles = [a for a in dataset["articles"] if a.get("date_basis") in ("crossref_online", "publisher_online")]
          from collections import Counter
          by_journal = Counter(a["journal"] for a in articles)
          assert sum(j["included_articles"] for j in journals) == len(articles), "Quellenprotokoll-Artikelzahl weicht ab"
          assert all(j["included_articles"] == by_journal[j["journal"]] for j in journals), "Journalzuordnung im Quellenprotokoll stimmt nicht"
          assert set(by_journal).issubset({j["journal"] for j in journals}), "Artikel aus unbekanntem Journal"
          assert dataset["verified_online_count"] == len(articles), "Verifizierte Artikelzahl weicht vom Datensatz ab"
          assert dataset["candidate_count"] == len(dataset["articles"]) - len(articles), "Kandidatenzahl weicht vom Datensatz ab"
          article_dois = set()
          for article in articles:
              doi = str(article.get("doi") or "").strip().lower()
              assert doi and doi not in article_dois, f"DOI fehlt oder ist doppelt: {doi}"
              article_dois.add(doi)
              assert article.get("date_basis") in ("crossref_online", "publisher_online"), f"Erst-Online-Beleg fehlt: {doi}"
              date = article.get("online_date")
              assert isinstance(date, str), f"Erst-Online-Datum fehlt: {doi}"
              from datetime import date as calendar_date
              assert calendar_date.fromisoformat(date).strftime("%Y-%m") == month, f"Datum außerhalb des Monats: {doi}"
              if article["date_basis"] == "publisher_online":
                  source = article.get("publisher_date_source")
                  assert isinstance(source, str) and source.startswith("https://"), f"Verlagsbeleg fehlt: {doi}"
          print(f"Monatsdatensatz geprüft: {len(articles)} belegte Erst-Online-Daten")
          print("Quellenprotokoll: 24 Journale, Vollständigkeitsgrenzen transparent")
          for path in monthly_files + simple_files:
              html = path.read_text(encoding="utf-8")
              inspector = Inspector()
              inspector.feed(html)
              assert html.lstrip().lower().startswith("<!doctype html>"), path
              assert month in html or __import__("datetime").date.fromisoformat(month+"-01").strftime("%B %Y") in html, f"Falscher Monat: {path}"
              assert "Rechercheentwurf" not in html, f"Entwurfsmarker: {path}"
              assert inspector.inputs == 0, f"Suchfeld: {path}"
              if path in monthly_files:
                  assert len(inspector.dois) == len(set(inspector.dois)), f"DOI-Dubletten: {path}"
                  assert {url.removeprefix("https://doi.org/").lower() for url in inspector.dois} == article_dois, f"HTML-DOIs stimmen nicht mit belegtem Monatsdatensatz überein: {path}"
                  assert inspector.articles == len(inspector.dois), f"Fehlende DOI-Links: {path}"
                  assert inspector.audit_rows == 24, f"Journal-Prüftabelle enthält nicht 24 Zeilen: {path}"
              print(f"Geprüft: {path}: {inspector.articles} Artikel, {len(inspector.dois)} DOI-Links")
          PY
      - name: Geprüfte HTML-Ergebnisse bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: End-to-End-Nachweis-${{ inputs.month }}
          path: checked/
          if-no-files-found: error
          retention-days: 90
