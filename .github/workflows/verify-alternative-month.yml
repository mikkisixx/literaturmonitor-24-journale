name: End-to-End-Nachweis alternativer Monat August 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-alternative-month.yml'
      - 'scripts/**'
      - '.github/workflows/monthly-report.yml'
      - '.github/workflows/einfacher-html-bericht.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  verify-alternative-month:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Beide Monatsgeneratoren auslösen und ihre Run-IDs erfassen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in monthly-report.yml einfacher-html-bericht.yml; do
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --ref main -f month=2026-08
            id=""
            for attempt in $(seq 1 30); do
              id="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=30" --jq '.workflow_runs[] | select(.created_at >= "'"$started"'") | select(.head_branch == "main") | .id' | head -n 1)"
              if [[ -n "$id" ]]; then break; fi
              sleep 10
            done
            if [[ -z "$id" ]]; then echo "::error::Run-ID für $workflow nicht gefunden"; exit 1; fi
            if [[ "$workflow" == monthly-report.yml ]]; then echo "monthly_report_yml=$id" >> "$GITHUB_ENV"; else echo "einfacher_html_bericht_yml=$id" >> "$GITHUB_ENV"; fi
            echo "Dispatched $workflow: $id"
          done
      - name: Beide Läufe bis zum erfolgreichen Abschluss überwachen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in monthly-report.yml einfacher-html-bericht.yml; do
            if [[ "$workflow" == monthly-report.yml ]]; then id="$monthly_report_yml"; else id="$einfacher_html_bericht_yml"; fi
            result=""
            for attempt in $(seq 1 180); do
              status="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.status')"
              if [[ "$status" == completed ]]; then
                result="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '.conclusion')"
                break
              fi
              echo "$workflow ($id): $status; poll $attempt/180"
              sleep 30
            done
            [[ "$result" == success ]] || { echo "::error::$workflow: ${result:-timeout}; run $id"; exit 1; }
          done
      - name: Artefakte herunterladen und August-HTML inhaltlich prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checked/monthly checked/simple
          gh run download "$monthly_report_yml" --name Literaturbericht-2026-08-HTML --dir checked/monthly
          gh run download "$einfacher_html_bericht_yml" --dir checked/simple
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.articles = 0
                  self.dois = []
                  self.inputs = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "article": self.articles += 1
                  if tag == "input": self.inputs += 1
                  if tag == "a" and attrs.get("href", "").startswith("https://doi.org/"):
                      self.dois.append(attrs["href"])
          monthly_files = list(Path("checked/monthly").rglob("*.html"))
          simple_files = list(Path("checked/simple").rglob("*.html"))
          assert monthly_files, "Kein HTML im Monatsbericht-Artefakt"
          assert simple_files, "Kein HTML im einfachen Berichts-Artefakt"
          for path in monthly_files + simple_files:
              html = path.read_text(encoding="utf-8")
              inspector = Inspector()
              inspector.feed(html)
              assert html.lstrip().lower().startswith("<!doctype html>"), path
              assert "2026-08" in html or "August 2026" in html, f"Falscher Monat: {path}"
              assert "Rechercheentwurf" not in html, f"Entwurfsmarker: {path}"
              assert inspector.inputs == 0, f"Suchfeld: {path}"
              if path in monthly_files:
                  assert len(inspector.dois) == len(set(inspector.dois)), f"DOI-Dubletten: {path}"
                  assert inspector.articles == len(inspector.dois), f"Fehlende DOI-Links: {path}"
              print(f"Geprüft: {path}: {inspector.articles} Artikel, {len(inspector.dois)} DOI-Links")
          PY
      - name: Geprüfte HTML-Ergebnisse bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: End-to-End-Nachweis-2026-08
          path: checked/
          if-no-files-found: error
          retention-days: 90
