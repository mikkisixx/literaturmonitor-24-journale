name: Monatsansichten aktualisieren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_months.py'
      - '.github/workflows/build-months.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monatsdaten erstellen
        run: python scripts/build_months.py
      - name: Monatsdaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/months/
          if ! git diff --cached --quiet; then
            git commit -m "Erzeuge vorläufige Monatsdaten"
            git push
          fi
